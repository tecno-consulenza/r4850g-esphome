  - platform: template
    name: "Temp. ingresso"
    web_server:
      sorting_group_id: grp_stato
      sorting_weight: 100
    id: input_temperature_sensor
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - lambda: |-
          return x / id(voltage_scaling_factor);
      - throttle_average: 5s
    icon: "mdi:thermometer"

  - platform: template
    name: "Corrente DC"
    web_server:
      sorting_group_id: grp_stato
      sorting_weight: 30
    id: output_current_sensor
    unit_of_measurement: "A"
    state_class: "measurement"
    accuracy_decimals: 2
    filters:
      - lambda: |-
          return x / id(voltage_scaling_factor);
      - throttle_average: 5s
    icon: "mdi:current-dc"

  # Limite di corrente che l'alimentatore sta applicando in questo momento
  - platform: template
    name: "Limite DC attivo"
    web_server:
      sorting_group_id: grp_stato
      sorting_weight: 120
    id: set_max_output_current_sensor
    unit_of_measurement: "A"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
      - lambda: |-
          return x / id(amp_scaling_factor);
      - throttle_average: 5s
    icon: "mdi:current-ac"

  - platform: template
    name: "Spegne fra"
    web_server:
      sorting_group_id: grp_prog
      sorting_weight: 30
    id: next_off_sensor
    unit_of_measurement: "min"
    accuracy_decimals: 0
    lambda: |-
      return id(off_time_countdown);
    update_interval: 15s
    icon: "mdi:timer-sand"

  # Energia DC erogata dall'avvio (o dall'ultimo azzeramento). device_class
  # e state_class permettono di usarla nella dashboard Energia di HA, che
  # gestisce da sola gli azzeramenti dopo un riavvio.
  # Rendimento istantaneo: potenza DC / potenza AC (medie di 5 s).
  # Sotto 30 W prelevati dalla rete il valore non è significativo.
  - platform: template
    name: "Rendimento"
    id: rendimento_sensor
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:percent-circle-outline"
    update_interval: 5s
    lambda: |-
      const float ac = id(ac_power_in_sensor).state;
      const float dc = id(dc_power_out_sensor).state;
      if (std::isnan(ac) || std::isnan(dc) || ac < 30.0f || dc < 0.0f) return NAN;
      const float r = dc / ac * 100.0f;
      if (r > 100.5f) return NAN;    // misure non allineate: valore scartato
      return r > 100.0f ? 100.0f : r;

  # Potenza persa in calore dentro l'alimentatore
  - platform: template
    name: "Perdite"
    id: perdite_sensor
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:fire"
    update_interval: 5s
    lambda: |-
      const float ac = id(ac_power_in_sensor).state;
      const float dc = id(dc_power_out_sensor).state;
      if (std::isnan(ac) || std::isnan(dc) || ac < 30.0f) return NAN;
      const float p = ac - dc;
      return p < 0.0f ? 0.0f : p;

  # Energia prelevata dalla rete dall'avvio (o dall'ultimo azzeramento)
  - platform: template
    name: "Energia dalla rete"
    id: consumed_ac_wh_sensor
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    icon: "mdi:transmission-tower"
    accuracy_decimals: 0
    lambda: |-
      return id(consumed_ac_wh);
    update_interval: 30s

  # Rendimento medio: energia erogata / energia prelevata (servono almeno 10 Wh)
  - platform: template
    name: "Rendimento medio"
    id: rendimento_medio_sensor
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:percent-outline"
    update_interval: 30s
    lambda: |-
      if (id(consumed_ac_wh) < 10.0) return NAN;
      const double r = id(consumed_wh) / id(consumed_ac_wh) * 100.0;
      return (float) (r > 100.0 ? 100.0 : r);

  - platform: template
    name: "Energia erogata"
    web_server:
      sorting_group_id: grp_stato
      sorting_weight: 140
    id: consumed_wh_sensor
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    icon: "mdi:transmission-tower-import"
    accuracy_decimals: 0
    lambda: |-
      return id(consumed_wh);
    update_interval: 30s

  - platform: template
    name: "Giri ventola"
    web_server:
      sorting_group_id: grp_stato
      sorting_weight: 110
    id: rpm_sensor
    unit_of_measurement: "giri/min"
    accuracy_decimals: 0
    icon: "mdi:fan"
    filters:
      - throttle_average: 5s

# ----------------------------------------------------------
#                    VALORI DA IMPOSTARE
# ----------------------------------------------------------
number:

  - platform: template
    name: "Ventola minima"
    web_server:
      sorting_group_id: grp_riserva
      sorting_weight: 30
    id: can_fan_speed_input
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    mode: SLIDER
    restore_value: true
    icon: "mdi:fan"
    on_value:
      then:
        - delay: 0.01s  # attesa breve perché il valore sia aggiornato
        - lambda: |-
            float fan_value = id(can_fan_speed_input).state;
            ESP_LOGI("comandi", "Velocità minima ventola: %.0f%%", fan_value);
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              // registro della velocità ventola
              can_data[0] = 0x01;
              can_data[1] = 0x14;
              // valore = percentuale x 256, su due byte (prima il più alto)
              int scaled_value = (int)(id(can_fan_speed_input).state * 256);
              can_data[2] = (scaled_value >> 8) & 0xFF;
              can_data[3] = scaled_value & 0xFF;
              // byte 4-7 a zero
              return can_data;

  - platform: template
    name: "Tensione di carica"
    web_server:
      sorting_group_id: grp_comandi
      sorting_weight: 30
    id: can_voltage_input
    min_value: 49
    max_value: 58
    step: 0.1
    unit_of_measurement: "V"
    optimistic: true
    mode: BOX
    restore_value: true
    initial_value: 53.5   # solo al primo avvio, poi resta l'ultimo valore impostato
    icon: "mdi:sine-wave"
    on_value:
      then:
        - delay: 0.01s
        - lambda: |-
            float voltage_value = id(can_voltage_input).state;
            ESP_LOGI("comandi", "Tensione di carica: %.1f V", voltage_value);
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              can_data[0] = 0x01;  // registro 0x100: tensione
              int scaled_value = (int) lroundf(id(can_voltage_input).state * id(voltage_scaling_factor));
              can_data[6] = (scaled_value >> 8) & 0xFF;
              can_data[7] = scaled_value & 0xFF;
              return can_data;

  - platform: template
    name: "Tensione di riserva"
    web_server:
      sorting_group_id: grp_riserva
      sorting_weight: 10
    id: fallback_voltage_input
    min_value: 49
    max_value: 58
    step: 0.1
    unit_of_measurement: "V"
    optimistic: true
    mode: BOX
    restore_value: True
    initial_value: 53.5   # solo al primo avvio (53.5 V è il valore di fabbrica)
    icon: "mdi:sine-wave"
    on_value:
      then:
        - delay: 0.01s
        - lambda: |-
            float fallback_voltage_value = id(fallback_voltage_input).state;
            ESP_LOGI("comandi", "Tensione di riserva: %.1f V", fallback_voltage_value);
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              can_data[0] = 0x01;
              can_data[1] = 0x01;  // registro 0x101: tensione di riserva
              int fallback_scaled_value = (int) lroundf(id(fallback_voltage_input).state * id(voltage_scaling_factor));
              can_data[6] = (fallback_scaled_value >> 8) & 0xFF;
              can_data[7] = fallback_scaled_value & 0xFF;
              return can_data;

  # 0 = nessun limite sulla corrente prelevata dalla rete
  - platform: template
    name: "Limite rete AC"
    web_server:
      sorting_group_id: grp_comandi
      sorting_weight: 50
    id: can_current_limit_input
    min_value: 0
    max_value: 21
    step: 0.1
    unit_of_measurement: "A"
    optimistic: true
    mode: BOX
    restore_value: True
    icon: "mdi:current-ac"
    on_value:
      then:
        - delay: 0.01s
        - lambda: |-
            float current_value = id(can_current_limit_input).state;
            float max_current = 10.0; // valore predefinito
            if (id(amp_scaling_factor) >= 18 && id(amp_scaling_factor) <= 22) {
              max_current = 17.0;
            } else if (id(amp_scaling_factor) >= 13 && id(amp_scaling_factor) <= 15) {
              max_current = 21.0;
            } else if (id(amp_scaling_factor) >= 25 && id(amp_scaling_factor) <= 35) {
              max_current = 13.0;
            }
            if (current_value > max_current) {
              ESP_LOGW("comandi", "Limite AC %.1f A oltre il massimo del modello (%.1f A): corretto", current_value, max_current);
              id(can_current_limit_input).publish_state(max_current);
              current_value = max_current;
            }
            if (current_value == 0) {
              ESP_LOGI("comandi", "Limite corrente dalla rete disattivato");
            } else {
              ESP_LOGI("comandi", "Limite corrente dalla rete: %.1f A", current_value);
            }
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              int scaled_value = (int) lroundf(id(can_current_limit_input).state * id(voltage_scaling_factor));
              can_data[0] = 0x01;
              can_data[1] = 0x09;
              can_data[3] = (id(can_current_limit_input).state > 0) ? 0x01 : 0x00;
              can_data[6] = (scaled_value >> 8) & 0xFF;
              can_data[7] = scaled_value & 0xFF;
              return can_data;

  - platform: template
    name: "Corrente di carica"
    web_server:
      sorting_group_id: grp_comandi
      sorting_weight: 40
    id: can_amp_input
    min_value: 0
    max_value: 75
    step: 0.1
    unit_of_measurement: "A"
    optimistic: true
    mode: BOX
    restore_value: true
    initial_value: 10     # solo al primo avvio, poi resta l'ultimo valore impostato
    icon: "mdi:current-dc"
    # set_action scatta solo quando cambi tu il valore (non quando lo cambia
    # la carica a fasi): è la corrente massima che la carica a fasi rispetta
    set_action:
      - lambda: |-
          id(user_amp) = x;
    on_value:
      then:
        - delay: 0.01s
        - lambda: |-
            float amp_value = id(can_amp_input).state;
            float max_amps = 75.0;
            if (id(amp_scaling_factor) >= 18 && id(amp_scaling_factor) <= 22) {
              max_amps = 50.0;
            } else if (id(amp_scaling_factor) >= 13 && id(amp_scaling_factor) <= 15) {
              max_amps = 75;
            } else if (id(amp_scaling_factor) >= 25 && id(amp_scaling_factor) <= 35) {
              max_amps = 30.0;
            }
            if (amp_value > max_amps) {
              ESP_LOGW("comandi", "Corrente %.1f A oltre il massimo del modello (%.1f A): corretta", amp_value, max_amps);
              id(can_amp_input).publish_state(max_amps);
              amp_value = max_amps;
            }
            ESP_LOGI("comandi", "Corrente di carica: %.1f A", amp_value);
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              int scaled_value = (int) lroundf(id(can_amp_input).state * id(amp_scaling_factor));
              can_data[0] = 0x01;
              can_data[1] = 0x03;
              can_data[6] = (scaled_value >> 8) & 0xFF;
              can_data[7] = scaled_value & 0xFF;
              return can_data;

  - platform: template
    name: "Corrente di riserva"
    web_server:
      sorting_group_id: grp_riserva
      sorting_weight: 20
    id: fallback_amp_input
    min_value: 0
    max_value: 75
    step: 0.1
    unit_of_measurement: "A"
    optimistic: true
    mode: BOX
    restore_value: true
    initial_value: 10     # solo al primo avvio, poi resta l'ultimo valore impostato
    icon: "mdi:current-dc"
    on_value:
      then:
        - delay: 0.01s
        - lambda: |-
            float fallback_amp_value = id(fallback_amp_input).state;
            float max_amps = 75.0;
            if (id(amp_scaling_factor) >= 18 && id(amp_scaling_factor) <= 22) {
              max_amps = 50.0;
            } else if (id(amp_scaling_factor) >= 13 && id(amp_scaling_factor) <= 15) {
              max_amps = 75;
            } else if (id(amp_scaling_factor) >= 25 && id(amp_scaling_factor) <= 35) {
              max_amps = 30.0;
            }
            if (fallback_amp_value > max_amps) {
              ESP_LOGW("comandi", "Corrente di riserva %.1f A oltre il massimo (%.1f A): corretta", fallback_amp_value, max_amps);
              id(fallback_amp_input).publish_state(max_amps);
              fallback_amp_value = max_amps;
            }
            ESP_LOGI("comandi", "Corrente di riserva: %.1f A", fallback_amp_value);
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              int scaled_value = (int) lroundf(id(fallback_amp_input).state * id(amp_scaling_factor));
              can_data[0] = 0x01;
              can_data[1] = 0x04;
              can_data[6] = (scaled_value >> 8) & 0xFF;
              can_data[7] = scaled_value & 0xFF;
              return can_data;

  # ------------------- OROLOGIO MANUALE -------------------
  # Serve solo se l'ora di Home Assistant non è disponibile (uso senza
  # rete). Con Home Assistant collegato viene ignorato. Non viene
  # memorizzato: dopo un riavvio va reimpostato.
  - platform: template
    name: "Ora manuale"
    web_server:
      sorting_group_id: grp_prog
      sorting_weight: 80
    min_value: 0
    max_value: 23
    step: 1
    mode: BOX
    optimistic: true
    restore_value: false
    icon: "mdi:clock"
    set_action:
      - lambda: |-
          const uint32_t now_ms = millis();
          const uint32_t elapsed_min = (now_ms - id(clock_base_ms)) / 60000u;
          const int cur = (int) ((id(clock_base_min) + elapsed_min) % 1440u);
          id(clock_base_min) = ((int) x) * 60 + (cur % 60);
          id(clock_base_ms) = now_ms;

  - platform: template
    name: "Minuti manuali"
    web_server:
      sorting_group_id: grp_prog
      sorting_weight: 90
    min_value: 0
    max_value: 59
    step: 1
    mode: BOX
    optimistic: true
    restore_value: false
    icon: "mdi:clock"
    set_action:
      - lambda: |-
          const uint32_t now_ms = millis();
          const uint32_t elapsed_min = (now_ms - id(clock_base_ms)) / 60000u;
          const int cur = (int) ((id(clock_base_min) + elapsed_min) % 1440u);
          id(clock_base_min) = (cur / 60) * 60 + (int) x;
          id(clock_base_ms) = now_ms;

  # ------------------- PROGRAMMAZIONE GIORNALIERA -------------------
  # Accensione e spegnimento alla stessa ora = programmazione disattivata
  - platform: template
    name: "Accendi: ora"
    web_server:
      sorting_group_id: grp_prog
      sorting_weight: 40
    id: on_hour
    min_value: 0
    max_value: 23
    step: 1
    mode: BOX
    optimistic: true
    restore_value: true
    icon: "mdi:timer-play"
    on_value:
      then:
        - lambda: |-
            id(g_show_schedule_update_log) = true;

  - platform: template
    name: "Accendi: minuti"
    web_server:
      sorting_group_id: grp_prog
      sorting_weight: 50
    id: on_minute
    min_value: 0
    max_value: 59
    step: 1
    mode: BOX
    optimistic: true
    restore_value: true
    icon: "mdi:timer-play"
    on_value:
      then:
        - lambda: |-
            id(g_show_schedule_update_log) = true;

  - platform: template
    name: "Spegni: ora"
    web_server:
      sorting_group_id: grp_prog
      sorting_weight: 60
    id: off_hour
    min_value: 0
    max_value: 23
    step: 1
    mode: BOX
    optimistic: true
    restore_value: true
    icon: "mdi:timer-off"
    on_value:
      then:
        - lambda: |-
            id(g_show_schedule_update_log) = true;

  - platform: template
    name: "Spegni: minuti"
    web_server:
      sorting_group_id: grp_prog
      sorting_weight: 70
    id: off_minute
    min_value: 0
    max_value: 59
    step: 1
    mode: BOX
    optimistic: true
    restore_value: true
    icon: "mdi:timer-off"
    on_value:
      then:
        - lambda: |-
            id(g_show_schedule_update_log) = true;

  # ------------------- CARICA A FASI -------------------
  # Sotto questa tensione le fasi si azzerano e il ciclo ricomincia
  - platform: template
    name: "Ripartenza fasi"
    web_server:
      sorting_group_id: grp_soft
      sorting_weight: 110
    id: stage_reset_voltage
    unit_of_measurement: "V"
    min_value: 48.00
    max_value: 58.00
    mode: BOX
    step: 0.01
    icon: "mdi:restore"
    optimistic: true
    restore_value: true
    initial_value: 53.2

  # ================= FASE 1
  - platform: template
    name: "Fase 1 tensione"
    web_server:
      sorting_group_id: grp_soft
      sorting_weight: 20
    id: stage1_threshold
    min_value: 45
    max_value: 58
    step: 0.01
    unit_of_measurement: "V"
    mode: BOX
    restore_value: true
    icon: "mdi:numeric-1-circle"
    optimistic: true
