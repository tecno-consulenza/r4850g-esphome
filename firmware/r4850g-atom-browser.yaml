    name: "Fattore di scala (interno)"
    lambda: |-
      return id(amp_scaling_factor);
    update_interval: 10s
    internal: true
    icon: "mdi:information-outline"

  # Corrente letta dal messaggio spontaneo: si aggiorna più spesso
  - platform: template
    name: "Corrente DC rapida"
    web_server:
      sorting_group_id: grp_stato
      sorting_weight: 130
    id: alt_amp_sensor
    unit_of_measurement: "A"
    accuracy_decimals: 2
    filters:
      - lambda: |-
          return x / id(amp_scaling_factor);
      - throttle_average: 5s
    icon: "mdi:current-dc"

  - platform: template
    name: "Potenza AC"
    web_server:
      sorting_group_id: grp_stato
      sorting_weight: 50
    id: ac_power_in_sensor
    unit_of_measurement: "W"
    state_class: "measurement"
    accuracy_decimals: 0
    filters:
      - lambda: |-
          return x / id(voltage_scaling_factor);
      - throttle_average: 5s
    icon: "mdi:flash"
    on_value:
      then:
        - lambda: |-
            // Contatore dell'energia prelevata dalla rete: stesso metodo
            // del contatore DC (media dei due valori x tempo trascorso)
            static uint32_t last_ms = 0;
            static float last_w = NAN;
            const uint32_t now_ms = millis();
            if (!std::isnan(x) && !std::isnan(last_w)) {
              const uint32_t dt_ms = now_ms - last_ms;
              if (dt_ms > 0 && dt_ms <= 30000) {
                id(consumed_ac_wh) += (double) (last_w + x) * 0.5 * (dt_ms / 3600000.0);
              }
            }
            last_w = x;
            last_ms = now_ms;

  - platform: template
    name: "Potenza DC"
    web_server:
      sorting_group_id: grp_stato
      sorting_weight: 40
    id: dc_power_out_sensor
    unit_of_measurement: "W"
    state_class: "measurement"
    accuracy_decimals: 0
    filters:
      - lambda: |-
          return x / id(voltage_scaling_factor);
      - throttle_average: 5s
    icon: "mdi:flash"
    on_value:
      then:
        - lambda: |-
            // Contatore energia: integra la potenza DC a ogni nuovo valore
            // (media dei due valori x tempo trascorso). Pause oltre 30 s
            // (alimentatore che non risponde) non vengono conteggiate.
            static uint32_t last_ms = 0;
            static float last_w = NAN;
            const uint32_t now_ms = millis();
            if (!std::isnan(x) && !std::isnan(last_w)) {
              const uint32_t dt_ms = now_ms - last_ms;
              if (dt_ms > 0 && dt_ms <= 30000) {
                id(consumed_wh) += (double) (last_w + x) * 0.5 * (dt_ms / 3600000.0);
              }
            }
            last_w = x;
            last_ms = now_ms;

