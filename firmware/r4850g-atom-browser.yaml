  # ================= FASE 4 (bilanciamento celle, poi spegnimento)
  - platform: template
    name: "Fase 4 tensione"
    web_server:
      sorting_group_id: grp_soft
      sorting_weight: 80
    id: stage4_threshold
    min_value: 45
    max_value: 58
    step: 0.01
    unit_of_measurement: "V"
    mode: BOX
    restore_value: true
    icon: "mdi:numeric-4-circle"
    optimistic: true
    initial_value: 55.5

  - platform: template
