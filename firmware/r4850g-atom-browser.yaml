# ============================================================================
# Alimentatore Huawei R4850G / R48xx comandato via CAN con ESPHome
# Firmware versione 12 - scheda M5Stack ATOM Lite
# https://github.com/tecno-consulenza/r4850g-esphome   (licenza MIT)
#
# Versione da installare dal browser (firmware già compilato, senza chiavi):
# il WiFi si sceglie subito dopo l'installazione o dalla rete di emergenza.
#
# Collegamenti modulo CAN (SN65HVD230 a 3,3 V) -> scheda:
#   3V3 -> 3V3     GND -> G     TX (CTX) -> G22     RX (CRX) -> G19
# Lato alimentatore: CANH -> CANH, CANL -> CANL (morsetti del modulo)
# Ritorno all'indirizzo IP automatico: tieni premuto il pulsante sul frontale (GPIO39) per 5 s
# oppure stacca e riattacca l'alimentazione 3 volte di seguito.
#
# La pagina web è nel file r4850g-web.js, che va tenuto nella stessa cartella.
# Il manuale completo è nella pagina dei rilasci su GitHub.
#
# Basato su "CAN-BUS control R4875G1 with ESPHome and MQTT" di mjpalmowski
# (licenza MIT), riscritto e ampliato.
# ============================================================================

substitutions:
  # nome del dispositivo: le ultime cifre del MAC vengono aggiunte da sole
  nome_dispositivo: r4850g
  nome_visibile: R4850G
  # nessuna rete WiFi scritta nel firmware: si sceglie dopo l'installazione
  wifi_ssid_iniziale: ""
  wifi_password_iniziale: ""
  # password della rete di emergenza (uguale per tutte le schede installate
  # dal browser: la rete serve solo per scegliere il WiFi)
  ap_password: "r4850g-setup"

  # Statistiche anonime (capitolo "Statistiche anonime" del manuale)
  versione_firmware: "12"
  tipo_scheda: "atom"
  statistiche_url: "https://statistiche-ha.tecnoconsulenza.it/api/ping.php"
  statistiche_chiave: "1b64051f4fec0f68dd5533a64c55eb8babe49558"

esphome:
  name: ${nome_dispositivo}
  friendly_name: ${nome_visibile}
  name_add_mac_suffix: true
  project:
    name: tecno-consulenza.r4850g-esphome
    version: "12"
  # intestazioni di ESP-IDF usate dalle funzioni di rete e dall'ora
  includes:
    - <esp_sntp.h>
    - <esp_netif.h>
    - <esp_event.h>
    - <esp_wifi.h>
    - <esp_http_client.h>
    - <esp_crt_bundle.h>
    - <esp_random.h>
    - <esp_timer.h>

  on_boot:
    # Prima che parta il WiFi (priorità 260: dopo la rete di base, prima del WiFi)
    - priority: 260
      then:
        - lambda: |-
            // 1) Accensioni rapide: 3 avvii di seguito, ciascuno spento entro
            //    10 secondi, riportano l'indirizzo IP al DHCP. Il contatore ha
            //    una chiave fissa e viene scritto subito in memoria.
            {
              auto pref = global_preferences->make_preference<uint32_t>(0x52344E31UL, true);
              uint32_t n = 0;
              if (!pref.load(&n) || n > 100) n = 0;
              n++;
              pref.save(&n);
              global_preferences->sync();
              ESP_LOGI("rete", "Avvio rapido n. %u", (unsigned) n);
              if (n >= 3) {
                id(net_statico) = false;
                n = 0;
                pref.save(&n);
                global_preferences->sync();
                id(rete_ripristinata) = true;
                ESP_LOGW("rete", "3 accensioni rapide: indirizzo IP riportato al DHCP");
              }
            }
            // 2) Rete WiFi iniziale. ESPHome salva la rete scelta dalla rete di
            //    emergenza o dalla pagina web con questa chiave (valida quando il
            //    file non elenca reti). Se è vuota si mette quella di secrets.yaml.
            {
              auto pref = global_preferences->make_preference<wifi::SavedWifiSettings>(88491487UL, true);
              wifi::SavedWifiSettings s{};
              const bool presente = pref.load(&s) && s.ssid[0] != '\0';
              const char *ss = R"__(${wifi_ssid_iniziale})__";
              const char *pw = R"__(${wifi_password_iniziale})__";
              if (!presente && ss[0] != '\0') {
                wifi::SavedWifiSettings n{};
                strncpy(n.ssid, ss, sizeof(n.ssid) - 1);
                strncpy(n.password, pw, sizeof(n.password) - 1);
                pref.save(&n);
                global_preferences->sync();
                ESP_LOGI("rete", "Salvata la rete WiFi iniziale: %s", ss);
              }
            }
            // 3) IP statico: appena la scheda si aggancia alla rete WiFi ferma il
            //    DHCP e imposta indirizzo, gateway, maschera e DNS. Questa
            //    funzione viene registrata prima di quelle di ESP-IDF, quindi
            //    gira prima: ESP-IDF vede il DHCP fermo e usa l'indirizzo statico.
            esp_event_handler_register(WIFI_EVENT, WIFI_EVENT_STA_CONNECTED,
              [](void *, esp_event_base_t, int32_t, void *) {
                if (!id(net_statico) || id(net_ip) == 0 || id(net_mask) == 0) return;
                esp_netif_t *nif = wifi::global_wifi_component->get_esp_netif_sta();
                if (nif == nullptr) return;
                esp_netif_dhcpc_stop(nif);
                esp_netif_ip_info_t info{};
                info.ip.addr = id(net_ip);
                info.gw.addr = id(net_gw);
                info.netmask.addr = id(net_mask);
                esp_netif_set_ip_info(nif, &info);
                esp_netif_dns_info_t dns{};
                dns.ip.type = ESP_IPADDR_TYPE_V4;
                dns.ip.u_addr.ip4.addr = id(net_dns1) != 0 ? id(net_dns1) : id(net_gw);
                esp_netif_set_dns_info(nif, ESP_NETIF_DNS_MAIN, &dns);
                if (id(net_dns2) != 0) {
                  dns.ip.u_addr.ip4.addr = id(net_dns2);
                  esp_netif_set_dns_info(nif, ESP_NETIF_DNS_BACKUP, &dns);
                }
              }, nullptr);
            ESP_LOGI("rete", "Indirizzo IP: %s", id(net_statico) ? "statico" : "automatico (DHCP)");
        # dopo 10 secondi di funzionamento l'avvio non conta più come "rapido"
        - delay: 10s
        - lambda: |-
            auto pref = global_preferences->make_preference<uint32_t>(0x52344E31UL, true);
            uint32_t n = 0;
            pref.save(&n);
            global_preferences->sync();
    - priority: 600
      then:
        # Recupero una tantum dei valori salvati con la versione 5.
        # ESPHome salva i valori sotto una chiave ricavata dal nome: avendo
        # cambiato i nomi, senza questo passaggio si ripartirebbe dai valori
        # di fabbrica. Il recupero avviene solo al primo avvio della v6.
        - lambda: |-
            if (id(recupero_v5_fatto)) return;
            struct Voce {
              const char *nome_v5;
              esphome::template_::TemplateNumber *numero;
            };
            Voce voci[] = {
              {"Fan Minimum Speed",                id(can_fan_speed_input)},
              {"10 Set Voltage Limit",             id(can_voltage_input)},
              {"11 Set Fallback Voltage Limit",    id(fallback_voltage_input)},
              {"14 Set AC Current Limit",          id(can_current_limit_input)},
              {"12 Set DC Current Limit",          id(can_amp_input)},
              {"13 Set Fallback DC Current Limit", id(fallback_amp_input)},
              {"Set ON Hour",                      id(on_hour)},
              {"Set ON Minute",                    id(on_minute)},
              {"Set OFF Hour",                     id(off_hour)},
              {"Set OFF Minute",                   id(off_minute)},
              {"Stage reset voltage",              id(stage_reset_voltage)},
              {"Stage Threshold 1",                id(stage1_threshold)},
              {"Stage Current 1",                  id(stage1_current)},
              {"Stage Threshold 2",                id(stage2_threshold)},
              {"Stage Current 2",                  id(stage2_current)},
              {"Stage Threshold 3",                id(stage3_threshold)},
              {"Stage Current 3",                  id(stage3_current)},
              {"Stage Threshold 4 Balance",        id(stage4_threshold)},
              {"Stage Current 4 Balance",          id(stage4_current)},
              {"Stage Time Balance",               id(stage4_duration)},
            };
            int recuperati = 0;
            for (auto &v : voci) {
              float valore;
              auto pref = global_preferences->make_preference<float>(
                  fnv1_hash_object_id(v.nome_v5, strlen(v.nome_v5)));
              if (pref.load(&valore) && !std::isnan(valore)) {
                v.numero->make_call().set_value(valore).perform();
                ESP_LOGI("recupero", "%s -> %.2f", v.nome_v5, valore);
                recuperati++;
              }
            }
            bool acceso;
            const char *nome_sw = "Soft Charge Enable";
            auto pref_sw = global_preferences->make_preference<bool>(
                fnv1_hash_object_id(nome_sw, strlen(nome_sw)));
            if (pref_sw.load(&acceso)) {
              if (acceso) id(soft_charge_enable).turn_on();
              else id(soft_charge_enable).turn_off();
              recuperati++;
            }
            id(recupero_v5_fatto) = true;
            ESP_LOGI("recupero", "Valori della versione 5 recuperati: %d", recuperati);
        - delay: 15s
        - script.execute: setup_sequence
        - script.execute: aggiorna_testi_rete
        - script.execute: applica_server_ntp
        - script.execute: statistiche_avvio

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  logs:
    # i singoli invii CAN non vengono elencati; gli errori di invio sì.
    # Per vederli tutti metti DEBUG al posto di INFO.
    canbus: INFO

api:
  # 0s = non riavviare la scheda se Home Assistant non si collega.
  # Il controllo della carica deve continuare anche con HA spento.
  reboot_timeout: 0s

ota:
  - platform: esphome

# Nessuna rete scritta qui: la scheda usa quella salvata in memoria (vedi
# on_boot). Così la rete scelta dalla pagina web o dalla rete di emergenza
# resta valida anche dopo un aggiornamento del firmware.
wifi:
  # 0s = non riavviare la scheda se il WiFi manca a lungo
  reboot_timeout: 0s
  # Rete di emergenza: se la rete salvata non si trova per un minuto e mezzo, la
  # scheda crea questa rete. Collegandosi si apre una pagina (di ESPHome, in
  # inglese) per scegliere la rete WiFi e scrivere la password.
  ap:
    password: "${ap_password}"

captive_portal:

# scelta del WiFi dal browser via USB, subito dopo l'installazione
improv_serial:

# Pagina web: http://IP-della-scheda, senza password.
# Chiunque sia collegato alla tua rete WiFi può aprirla e usare i comandi.
# La pagina è quella del file r4850g-web.js (stessa cartella di questo file):
# viene salvata dentro la scheda, quindi si apre anche senza internet.
# js_url vuoto = non carica la pagina standard di ESPHome da internet.
web_server:
  port: 80
  version: 3
  js_include: "r4850g-web.js"
  js_url: ""
  log: false
  # mostra alla pagina anche le voci interne (impostazioni di rete): in Home
  # Assistant non compaiono
  include_internal: true
  # niente caricamento del firmware dalla pagina: senza password chiunque
  # sulla rete potrebbe farlo. Gli aggiornamenti si fanno da Device Builder.
  ota: false
  sorting_groups:
    - id: grp_stato
      name: "Stato"
      sorting_weight: 10
    - id: grp_comandi
      name: "Comandi"
      sorting_weight: 20
    - id: grp_soft
      name: "Carica a fasi"
      sorting_weight: 30
    - id: grp_prog
      name: "Programmazione oraria"
      sorting_weight: 40
    - id: grp_riserva
      name: "Valori di riserva e ventola"
      sorting_weight: 50
    - id: grp_info
      name: "Informazioni e diagnostica"
      sorting_weight: 60

# Collegamento HTTPS usato dalle statistiche anonime: porta nel firmware il
# client HTTP di ESP-IDF e l'elenco delle autorità dei certificati, così il
# server viene verificato (Let's Encrypt e le altre più diffuse).
http_request:
  verify_ssl: true
  timeout: 10s

# Ora per la programmazione giornaliera di accensione e spegnimento.
# Prima fonte: internet (NTP). Seconda: Home Assistant, se c'è. Le due fonti
# regolano lo stesso orologio della scheda. Senza nessuna delle due si usa
# l'orologio manuale della pagina web.
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Rome
    servers:
      - 0.it.pool.ntp.org
      - 1.it.pool.ntp.org
      - time.google.com
    on_time_sync:
      - lambda: |-
          id(fonte_ora) = 1;
          id(fonte_ora_text).publish_state("Internet (NTP)");
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - lambda: |-
          if (id(fonte_ora) != 1) {
            id(fonte_ora) = 2;
            id(fonte_ora_text).publish_state("Home Assistant");
          }

# ─────────────────────────── variabili interne ───────────────────────────
# "restore_value: true" = il valore resta memorizzato anche dopo un riavvio
globals:
  # ---------------- Statistiche anonime ----------------
  # Codice casuale dell'installazione (128 bit): nasce al primo avvio e resta
  # in memoria. Non contiene nulla della scheda o della rete.
  - id: stat_id_1
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: stat_id_2
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: stat_id_3
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: stat_id_4
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  # secondi dall'avvio in cui fare il prossimo invio
  - id: stat_prossimo
    type: int64_t
    restore_value: no
    initial_value: '0'
  # 0 = fermo, 1 = invio in corso, 2 = invio finito (esito in stat_esito)
  - id: stat_stato
    type: int
    restore_value: no
    initial_value: '0'
  # codice HTTP della risposta, -1 se il server non è raggiungibile
  - id: stat_esito
    type: int
    restore_value: no
    initial_value: '0'
  # consenso: 0 = non ancora chiesto, 1 = accettato, 2 = rifiutato
  - id: stat_scelta
    type: int
    restore_value: yes
    initial_value: '0'
  # ultimo invio chiesto a mano dalla pagina (per non ripeterlo di continuo)
  - id: stat_manuale
    type: int64_t
    restore_value: no
    initial_value: '-1000'


  # ------------------ RETE (memorizzati) ------------------
  # Indirizzi in formato lwIP (byte nell'ordine della rete). 0 = non impostato
  - id: net_statico
    type: bool
    restore_value: true
    initial_value: "false"
  - id: net_ip
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: net_gw
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: net_mask
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: net_dns1
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: net_dns2
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # Vero se a questo avvio l'IP è stato riportato al DHCP (3 accensioni rapide)
  - id: rete_ripristinata
    type: bool
    restore_value: no
    initial_value: "false"
  # Esito della validazione nelle funzioni di rete
  - id: rete_ok
    type: bool
    restore_value: no
    initial_value: "false"
  # Fonte dell'ora: 0 nessuna, 1 internet, 2 Home Assistant
  - id: fonte_ora
    type: int
    restore_value: no
    initial_value: "0"

  # Diventa vero dopo il recupero dei valori della versione 5 (vedi on_boot)
  - id: recupero_v5_fatto
    type: bool
    restore_value: true
    initial_value: "false"

  # Corrente scelta da te in "Corrente di carica". La carica a fasi
  # non la supera mai e la ripristina quando le fasi finiscono.
  - id: user_amp
    type: float
    restore_value: no
    initial_value: 'NAN'

  # Orologio manuale: minuto del giorno impostato e millis() in quel momento
  - id: clock_base_min
    type: int
    restore_value: no
    initial_value: '0'

  - id: clock_base_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Diagnostica CAN: messaggi ricevuti dall'avvio e valore al controllo precedente
  - id: can_rx_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: can_rx_last
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Fattore per convertire la corrente in ampere nel valore da mandare
  # all'alimentatore (1024 / corrente nominale). Ricalcolato a ogni avvio.
  - id: amp_scaling_factor
    type: float
    restore_value: true
    initial_value: "19.6923"

  # Tensioni, potenze e temperature arrivano moltiplicate per 1024
  - id: voltage_scaling_factor
    type: int
    initial_value: "1024"
    restore_value: true

  - id: max_amp_limit
    type: float
    initial_value: "75"
    restore_value: true

  # Rilevamento dell'alimentatore all'avvio
  - id: max_current_found_board_1
    type: bool
    initial_value: "false"

  - id: search_counter_board_1
    type: int
    restore_value: no
    initial_value: "0"

  - id: data_found_board_1
    type: bool
    initial_value: "false"

  - id: daily_schedule_disabled
    type: bool
    restore_value: no
    initial_value: "false"

  # Energia DC erogata (Wh), aggiornata a ogni nuova misura di potenza
  - id: consumed_wh
    type: double
    restore_value: no
    initial_value: "0.0"

  # Energia AC prelevata dalla rete (Wh), per il rendimento medio
  - id: consumed_ac_wh
    type: double
    restore_value: no
    initial_value: "0.0"

  - id: frame_counter_bp1
    type: int
    restore_value: no
    initial_value: '0'

  - id: frame_counter_msg_start1
    type: int
    restore_value: no
    initial_value: '0'

  - id: search_attempts
    type: int
    restore_value: no
    initial_value: '0'

  # Testo con i dati di targa letto dall'alimentatore
  - id: board_properties
    type: std::string
    initial_value: '""'

  - id: board_properties_complete
    type: bool
    initial_value: "false"

  - id: barcode_found
    type: bool
    restore_value: no
    initial_value: 'false'

  # Stato della carica a fasi
  - id: last_staged_current
    type: float
    restore_value: no
    initial_value: "40.0"

  - id: stage1_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stage2_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stage3_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stage4_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: pre_stage_amp
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: prev_any_stage_active
    type: bool
    restore_value: no
    initial_value: "false"

  # Secondi trascorsi nella fase 4 (bilanciamento)
  - id: stage4_elapsed_s
    type: int
    restore_value: no
    initial_value: "0"

  # Vero dopo lo spegnimento a fine bilanciamento: la fase 4 non riparte
  # finché la batteria non scende sotto la tensione di ripartenza
  - id: stage4_forced_off
    type: bool
    restore_value: no
    initial_value: "false"

  # Variabili di appoggio delle fasi (non usate dalla logica attuale)
  - id: custom_stage1_threshold
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: custom_stage1_current
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: custom_stage2_threshold
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: custom_stage2_current
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: custom_stage3_threshold
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: custom_stage3_current
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: custom_stage4_threshold
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: custom_stage4_current
    type: float
    restore_value: no
    initial_value: "0.0"

  # Valori salvati con "Salva valori":
  # 0-7 = soglia e corrente delle fasi 1-4, 8 = tensione di ripartenza
  - id: custom_stage
    type: float[9]
    restore_value: yes
    initial_value: '{0,0,0,0,0,0,0,0,0}'

  # ------------------ OROLOGIO -------------------
  - id: current_hour       # ora attuale (0-23)
    type: int
    restore_value: no
    initial_value: '0'
  - id: current_minute     # minuto attuale (0-59)
    type: int
    restore_value: no
    initial_value: '0'

  - id: on_time_countdown
    type: int
    restore_value: no
    initial_value: '0'

  - id: off_time_countdown
    type: int
    restore_value: no
    initial_value: '0'

  - id: g_last_on_delta
    type: int
    restore_value: no
    initial_value: '-1'
  - id: g_last_off_delta
    type: int
    restore_value: no
    initial_value: '-1'

  - id: g_schedule_disabled_prev
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_show_schedule_update_log
    type: bool
    restore_value: no
    initial_value: 'true'

# ----------------------------------------------------------
#        IMPOSTAZIONI DI RETE (solo nella pagina web)
# ----------------------------------------------------------
text:
  - platform: template
    name: "Rete WiFi"
    id: txt_ssid
    internal: true
    optimistic: true
    restore_value: false
    max_length: 32
    mode: text
  - platform: template
    name: "Password WiFi"
    id: txt_wifi_pw
    internal: true
    optimistic: true
    restore_value: false
    max_length: 63
    mode: password
  - platform: template
    name: "IP statico"
    id: txt_ip
    internal: true
    optimistic: true
    restore_value: true
    max_length: 15
    mode: text
  - platform: template
    name: "Maschera di rete"
    id: txt_mask
    internal: true
    optimistic: true
    restore_value: true
    initial_value: "255.255.255.0"
    max_length: 15
    mode: text
  - platform: template
    name: "Gateway"
    id: txt_gw
    internal: true
    optimistic: true
    restore_value: true
    max_length: 15
    mode: text
  - platform: template
    name: "DNS 1"
    id: txt_dns1
    internal: true
    optimistic: true
    restore_value: true
    max_length: 15
    mode: text
  - platform: template
    name: "DNS 2"
    id: txt_dns2
    internal: true
    optimistic: true
    restore_value: true
    max_length: 15
    mode: text
  # vuoto = server predefiniti (it.pool.ntp.org, time.google.com)
  - platform: template
    name: "Server NTP"
    id: txt_ntp
    internal: true
    optimistic: true
    restore_value: true
    max_length: 64
    mode: text
    set_action:
      - script.execute: applica_server_ntp
      - lambda: |-
          id(esito_rete).publish_state(x.empty() ? "Server NTP: predefiniti" : "Server NTP: " + x);

select:
  - platform: template
    name: "Modalità IP"
    id: sel_modo_ip
    internal: true
    optimistic: true
    restore_value: true
    options:
      - "Automatico (DHCP)"
      - "Statico"
    initial_option: "Automatico (DHCP)"

# Pulsante della scheda tenuto premuto 5 secondi: IP di nuovo automatico
binary_sensor:
  - platform: gpio
    id: pulsante_scheda
    pin:
      number: GPIO39         # pulsante sul frontale dell'ATOM Lite
      inverted: true
      mode:
        input: true          # GPIO39 ha la resistenza di pull-up sulla scheda
    internal: true
    on_press:
      - delay: 5s
      - if:
          condition:
            binary_sensor.is_on: pulsante_scheda
          then:
            - script.execute: ritorno_dhcp

switch:
  - platform: template
    name: "Carica a fasi attiva"
    web_server:
      sorting_group_id: grp_soft
      sorting_weight: 10
    id: soft_charge_enable
    icon: "mdi:scale-balance"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - script.execute: soft_charge_reset
    turn_off_action:
      - script.execute: soft_charge_reset

  # Statistiche anonime: acceso di partenza, si spegne dalla pagina o da HA
  - platform: template
    name: "Statistiche anonime"
    id: stat_attive
    icon: "mdi:chart-bar"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - lambda: |-
          if (id(stat_scelta) != 1) { id(stat_scelta) = 1; global_preferences->sync(); }
          id(stat_scelta_text).publish_state("fatta");
          id(stat_prossimo) = esp_timer_get_time() / 1000000 + 60 + (esp_random() % 240);
          id(stat_esito_text).publish_state("Attive: prossimo invio entro 5 minuti");
          ESP_LOGI("statistiche", "Statistiche anonime attivate");
    turn_off_action:
      - lambda: |-
          id(stat_esito_text).publish_state("Disattivate: la scheda non invia nulla");
          ESP_LOGI("statistiche", "Statistiche anonime disattivate");


# ----------------------------------------------------------
#                      SCRIPT
# ----------------------------------------------------------
script:
  # ---------------- STATISTICHE ANONIME ----------------
  # All'avvio: crea il codice casuale (solo la prima volta) e fissa il primo
  # invio tra 10 e 30 minuti, così le schede non scrivono tutte insieme.
  - id: statistiche_avvio
    then:
      - lambda: |-
          if (id(stat_id_1) == 0 && id(stat_id_2) == 0 && id(stat_id_3) == 0 && id(stat_id_4) == 0) {
            id(stat_id_1) = esp_random();
            id(stat_id_2) = esp_random();
            id(stat_id_3) = esp_random();
            id(stat_id_4) = esp_random() | 1u;
            global_preferences->sync();
            ESP_LOGI("statistiche", "Creato il codice anonimo dell'installazione");
          }
          char cod[33];
          snprintf(cod, sizeof(cod), "%08" PRIx32 "%08" PRIx32 "%08" PRIx32 "%08" PRIx32,
                   id(stat_id_1), id(stat_id_2), id(stat_id_3), id(stat_id_4));
          id(stat_codice_text).publish_state(cod);
          id(stat_prossimo) = esp_timer_get_time() / 1000000 + 600 + (esp_random() % 1200);
          // senza consenso esplicito le statistiche restano spente
          if (id(stat_scelta) != 1 && id(stat_attive).state) id(stat_attive).turn_off();
          id(stat_scelta_text).publish_state(id(stat_scelta) == 0 ? "da_chiedere" : "fatta");
          if (id(stat_scelta) == 0) {
            id(stat_esito_text).publish_state("In attesa della tua scelta: nessun invio");
          } else {
            id(stat_esito_text).publish_state(id(stat_attive).state
                ? "Attive: primo invio entro mezz'ora dall'avvio"
                : "Disattivate: la scheda non invia nulla");
          }

  # Prepara i dati e li manda al server in un'attività separata (FreeRTOS):
  # il collegamento HTTPS dura qualche secondo e non deve fermare il ciclo
  # che comanda l'alimentatore. L'esito viene letto dal controllo ogni minuto.
  - id: statistiche_invia
    mode: single
    then:
      - lambda: |-
          const int64_t ora = esp_timer_get_time() / 1000000;
          if (__atomic_load_n(&id(stat_stato), __ATOMIC_ACQUIRE) != 0) return;
          if (id(stat_codice_text).state.size() != 32) return;
          if (wifi::global_wifi_component == nullptr || !wifi::global_wifi_component->is_connected()) {
            id(stat_prossimo) = ora + 900;
            id(stat_esito_text).publish_state("In attesa del WiFi per l'invio");
            return;
          }
          if (esp_get_free_heap_size() < 50000) {
            id(stat_prossimo) = ora + 900;
            ESP_LOGW("statistiche", "Memoria libera bassa (%u byte): invio rimandato di 15 minuti",
                     (unsigned) esp_get_free_heap_size());
            return;
          }
          // modello dell'alimentatore: solo lettere, cifre, spazio . _ - /
          std::string mod;
          for (char ch : id(board_type_sensor_1).state) {
            if (isalnum((unsigned char) ch) || ch == ' ' || ch == '.' || ch == '_' || ch == '-' || ch == '/') mod += ch;
            if (mod.size() >= 32) break;
          }
          while (!mod.empty() && mod.back() == ' ') mod.pop_back();
          while (!mod.empty() && mod.front() == ' ') mod.erase(0, 1);
          char corpo[200];
          snprintf(corpo, sizeof(corpo),
                   "{\"id\":\"%s\",\"fw\":\"%s\",\"scheda\":\"%s\",\"esphome\":\"%s\",\"modello\":\"%s\"}",
                   id(stat_codice_text).state.c_str(), "${versione_firmware}", "${tipo_scheda}", ESPHOME_VERSION, mod.c_str());

          struct Invio {
            std::string url, chiave, programma, corpo;
            int *esito;
            int *stato;
          };
          auto *inv = new Invio{"${statistiche_url}", "${statistiche_chiave}", "R4875G-ESPHome/${versione_firmware}",
                                corpo, &id(stat_esito), &id(stat_stato)};
          TaskFunction_t lavoro = [](void *arg) {
            Invio *p = static_cast<Invio *>(arg);
            esp_http_client_config_t cfg = {};
            cfg.url = p->url.c_str();
            cfg.method = HTTP_METHOD_POST;
            cfg.timeout_ms = 10000;
            cfg.crt_bundle_attach = esp_crt_bundle_attach;
            cfg.disable_auto_redirect = true;
            cfg.user_agent = p->programma.c_str();
            cfg.keep_alive_enable = false;
            int esito = -1;
            esp_http_client_handle_t c = esp_http_client_init(&cfg);
            if (c != nullptr) {
              esp_http_client_set_header(c, "Content-Type", "application/json");
              esp_http_client_set_header(c, "X-R4875G-Key", p->chiave.c_str());
              esp_http_client_set_post_field(c, p->corpo.c_str(), (int) p->corpo.size());
              if (esp_http_client_perform(c) == ESP_OK) esito = esp_http_client_get_status_code(c);
              esp_http_client_cleanup(c);
            }
            *p->esito = esito;
            __atomic_store_n(p->stato, 2, __ATOMIC_RELEASE);
            delete p;
            vTaskDelete(nullptr);
          };
          __atomic_store_n(&id(stat_stato), 1, __ATOMIC_RELEASE);
          id(stat_esito_text).publish_state("Invio in corso");
          ESP_LOGD("statistiche", "Invio: %s", corpo);
          if (xTaskCreate(lavoro, "statistiche", 10240, inv, tskIDLE_PRIORITY + 1, nullptr) != pdPASS) {
            delete inv;
            __atomic_store_n(&id(stat_stato), 0, __ATOMIC_RELEASE);
            id(stat_prossimo) = ora + 3600;
            id(stat_esito_text).publish_state("Invio non riuscito: memoria insufficiente. Riprovo tra un'ora");
            ESP_LOGW("statistiche", "Impossibile avviare l'invio: memoria insufficiente");
          }

  # Mostra nella pagina la configurazione IP salvata
  - id: aggiorna_testi_rete
    then:
      - lambda: |-
          auto ip = [](uint32_t a) {
            char b[16];
            snprintf(b, sizeof(b), "%u.%u.%u.%u", (unsigned) (a & 0xFF), (unsigned) ((a >> 8) & 0xFF),
                     (unsigned) ((a >> 16) & 0xFF), (unsigned) (a >> 24));
            return std::string(b);
          };
          if (id(net_statico) && id(net_ip) != 0) {
            id(config_ip_text).publish_state("Statico " + ip(id(net_ip)) + ", gateway " + ip(id(net_gw)) +
                                             ", maschera " + ip(id(net_mask)));
          } else {
            id(config_ip_text).publish_state("Automatico (DHCP)");
          }
          if (id(rete_ripristinata)) {
            id(esito_rete).publish_state("Indirizzo IP riportato al DHCP dopo 3 accensioni rapide");
          }
          if (id(fonte_ora) == 0) {
            id(fonte_ora_text).publish_state("Nessuna: imposta l'orologio manuale");
          }

  # Server NTP scelto dalla pagina: sostituisce il primo dei tre predefiniti.
  # La stringa resta in un buffer statico perché SNTP conserva il puntatore.
  - id: applica_server_ntp
    then:
      - lambda: |-
          static char server[65];
          const std::string &s = id(txt_ntp).state;
          if (s.empty()) {
            ESP_LOGI("ora", "Server NTP predefiniti");
            return;
          }
          strncpy(server, s.c_str(), sizeof(server) - 1);
          server[sizeof(server) - 1] = '\0';
          esp_sntp_stop();
          esp_sntp_setservername(0, server);
          esp_sntp_init();
          ESP_LOGI("ora", "Server NTP: %s", server);

  # Controlla e salva le impostazioni IP, poi riavvia
  - id: applica_ip
    mode: single
    then:
      - lambda: |-
          id(rete_ok) = false;
          // indirizzo a.b.c.d -> formato lwIP (out) e numero "leggibile" (h)
          auto leggi = [](const std::string &s, uint32_t &out, uint32_t &h) -> bool {
            unsigned v[4]; int pos = 0;
            if (s.size() < 7 || s.size() > 15) return false;
            for (char c : s) if (!(c == '.' || (c >= '0' && c <= '9'))) return false;
            if (sscanf(s.c_str(), "%u.%u.%u.%u%n", &v[0], &v[1], &v[2], &v[3], &pos) != 4 || pos != (int) s.size()) return false;
            for (unsigned x : v) if (x > 255) return false;
            out = v[0] | (v[1] << 8) | (v[2] << 16) | (v[3] << 24);
            h = (v[0] << 24) | (v[1] << 16) | (v[2] << 8) | v[3];
            return true;
          };
          auto errore = [](const char *m) {
            id(esito_rete).publish_state(std::string("Errore: ") + m);
            ESP_LOGW("rete", "Impostazioni IP rifiutate: %s", m);
          };
          if (id(sel_modo_ip).current_option() != std::string("Statico")) {
            id(net_statico) = false;
            id(rete_ok) = true;
            id(esito_rete).publish_state("Salvato: indirizzo automatico (DHCP). Riavvio in corso");
            return;
          }
          uint32_t ip, gw, mask, d1 = 0, d2 = 0, hip, hgw, hmask, hx;
          if (!leggi(id(txt_ip).state, ip, hip)) { errore("indirizzo IP non valido"); return; }
          if (!leggi(id(txt_mask).state, mask, hmask)) { errore("maschera di rete non valida"); return; }
          if (hmask == 0 || hmask == 0xFFFFFFFFu || ((~hmask + 1) & ~hmask) != 0) { errore("maschera di rete non valida"); return; }
          if (!leggi(id(txt_gw).state, gw, hgw)) { errore("gateway non valido"); return; }
          if ((hip & hmask) != (hgw & hmask)) { errore("gateway fuori dalla rete dell'indirizzo IP"); return; }
          if ((hip & ~hmask) == 0 || (hip & ~hmask) == ~hmask) { errore("indirizzo IP riservato per questa maschera"); return; }
          if (hip == hgw) { errore("indirizzo IP uguale al gateway"); return; }
          if (!id(txt_dns1).state.empty() && !leggi(id(txt_dns1).state, d1, hx)) { errore("DNS 1 non valido"); return; }
          if (!id(txt_dns2).state.empty() && !leggi(id(txt_dns2).state, d2, hx)) { errore("DNS 2 non valido"); return; }
          id(net_ip) = ip; id(net_gw) = gw; id(net_mask) = mask; id(net_dns1) = d1; id(net_dns2) = d2;
          id(net_statico) = true;
          id(rete_ok) = true;
          id(esito_rete).publish_state("Salvato: indirizzo statico " + id(txt_ip).state + ". Riavvio in corso");
      - if:
          condition:
            lambda: 'return id(rete_ok);'
          then:
            - delay: 2s
            - button.press: sys_restart

  # Salva la nuova rete WiFi e riavvia. L'IP torna automatico (DHCP), perché
  # un indirizzo statico di un'altra rete non funzionerebbe.
  - id: applica_wifi
    mode: single
    then:
      - lambda: |-
          id(rete_ok) = false;
          const std::string ss = id(txt_ssid).state;
          const std::string pw = id(txt_wifi_pw).state;
          if (ss.empty() || ss.size() > 32) {
            id(esito_rete).publish_state("Errore: nome della rete mancante o più lungo di 32 caratteri");
            return;
          }
          if (!pw.empty() && (pw.size() < 8 || pw.size() > 63)) {
            id(esito_rete).publish_state("Errore: la password WiFi deve avere da 8 a 63 caratteri (o nessuna per una rete aperta)");
            return;
          }
          wifi::global_wifi_component->save_wifi_sta(ss, pw);
          id(net_statico) = false;
          id(txt_wifi_pw).publish_state("");
          id(rete_ok) = true;
          id(esito_rete).publish_state("Salvato: rete " + ss + ". Riavvio in corso");
          ESP_LOGI("rete", "Nuova rete WiFi salvata: %s", ss.c_str());
      - if:
          condition:
            lambda: 'return id(rete_ok);'
          then:
            - delay: 2s
            - button.press: sys_restart

  # Ritorno al DHCP (pulsante della scheda tenuto premuto)
  - id: ritorno_dhcp
    then:
      - lambda: |-
          id(net_statico) = false;
          ESP_LOGW("rete", "Pulsante: indirizzo IP riportato al DHCP");
      - delay: 1s
      - button.press: sys_restart

  - id: setup_sequence
    mode: single
    then:
      # Rileva l'alimentatore e la sua corrente nominale
      - script.execute: detect_data_board_1
      - delay: 1s

  - id: detect_data_board_1
    then:
      - lambda: |-
          id(max_current_found_board_1) = false; // azzera prima di cercare
          id(search_counter_board_1) = 0;        // contatore dei tentativi
      - while:
          condition:
            lambda: |-
              // continua finché non trova l'alimentatore, al massimo 10 volte
              return !id(max_current_found_board_1) && id(search_counter_board_1) < 10;
          then:
            # richiesta della corrente nominale
            - canbus.send:
                can_id: 0x108150fe
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            # richiesta dei dati di targa
            - canbus.send:
                can_id: 0x1081D2FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(search_counter_board_1) += 1;
      - delay: 1s
      - lambda: |-
          if (id(search_counter_board_1) >= 10) {
            ESP_LOGW("canbus", "Alimentatore non trovato dopo 10 tentativi: ricerca interrotta");
          }

  - id: soft_charge_reset
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("carica_fasi", "Interruttore cambiato: azzero lo stato delle fasi");
          id(stage1_active)        = false;
          id(stage2_active)        = false;
          id(stage3_active)        = false;
          id(stage4_active)        = false;
          id(stage4_forced_off)    = false;
          id(stage4_elapsed_s)     = 0;
          id(prev_any_stage_active)= false;
          // Corrente impostata da te: al primo giro la prende dal valore salvato
          if (std::isnan(id(user_amp))) {
            id(user_amp) = id(can_amp_input).state;
          }
          // Se una fase aveva ridotto la corrente, torna a quella impostata
          // (on_value di "Corrente di carica" manda il comando)
          if (!std::isnan(id(user_amp)) &&
              (std::isnan(id(can_amp_input).state) ||
               fabsf(id(can_amp_input).state - id(user_amp)) >= 0.05f)) {
            ESP_LOGI("carica_fasi", "Ripristino la corrente impostata: %.1f A", id(user_amp));
            id(can_amp_input).publish_state(id(user_amp));
          }
          id(last_staged_current)  = id(user_amp);
          id(pre_stage_amp)        = id(user_amp);

# ----------------------------------------------------------
#                      BUS CAN
# ----------------------------------------------------------
canbus:
  - platform: esp32_can
    tx_pin: GPIO22    # verso CTX (o TX) del modulo CAN
    rx_pin: GPIO19    # verso CRX (o RX) del modulo CAN
    can_id: 0xE5F32E5
    bit_rate: 125kbps
    use_extended_id: True
    rx_queue_len: 32
    # all'avvio partono 6 comandi insieme: con la coda predefinita (5)
    # l'ultimo poteva essere scartato
    tx_queue_len: 16
    on_frame:
      # Conta tutti i messaggi ricevuti (sensore "Messaggi CAN")
      - can_id: 0
        can_id_mask: 0
        use_extended_id: true
        then:
          - lambda: |-
              id(can_rx_count) += 1;

      # Risposta alla richiesta dei dati (0x108040FE). L'alimentatore manda
      # più messaggi 0x1081407F e chiude con 0x1081407E: la maschera li
      # prende tutti e due.
      - can_id: 0x1081407E
        can_id_mask: 0x1FFFFFFE
        use_extended_id: true
        then:
          - lambda: |-
              if (x.size() < 8) return;
              if ((x[0] & 0xF0) != 0) return;   // risposta con codice di errore
              const uint16_t reg = ((uint16_t) (x[0] & 0x0F) << 8) | x[1];
              // valore a 32 bit con segno: le temperature possono essere negative
              const int32_t value = (int32_t) (((uint32_t) x[4] << 24) |
                                               ((uint32_t) x[5] << 16) |
                                               ((uint32_t) x[6] << 8) |
                                                (uint32_t) x[7]);
              const float v = (float) value;
              switch (reg) {
                case 0x170: id(ac_power_in_sensor).publish_state(v); break;
                case 0x171: id(grid_frequency_sensor).publish_state(v); break;
                case 0x172: id(input_current_sensor).publish_state(v); break;
                case 0x173: id(dc_power_out_sensor).publish_state(v); break;
                case 0x175: id(output_voltage_sensor).publish_state(v); break;
                case 0x176: id(set_max_output_current_sensor).publish_state(v); break;
                case 0x178: id(input_grid_voltage_sensor).publish_state(v); break;
                case 0x17F: id(output_temperature_sensor).publish_state(v); break;
                case 0x180: id(input_temperature_sensor).publish_state(v); break;
                case 0x181: id(output_current_sensor).publish_state(v); break;
                case 0x10E: id(operating_hours).publish_state(v); break;
                default: break;
              }

      # Messaggio spontaneo dell'alimentatore (ogni 377 ms):
      # byte 3 = 1 se l'uscita è spenta, byte 6-7 = corrente istantanea
      - can_id: 0x1001117E
        use_extended_id: true
        then:
          - lambda: |-
              if (x.size() < 8) return;
              const uint8_t state_byte = x[3];
              const uint8_t error_byte = x[4];
              const uint16_t alt_amp_value = ((uint16_t) x[6] << 8) | x[7];

              // Pubblica solo quando il valore cambia
              const float last_raw = id(alt_amp_sensor).get_raw_state();
              if (std::isnan(last_raw) || last_raw != (float) alt_amp_value) {
                id(alt_amp_sensor).publish_state(alt_amp_value);
              }

              const char *new_power_state = "Acceso";
              if (error_byte == 1) {
                new_power_state = "Errore";
              } else if (state_byte != 0) {
                new_power_state = "Spento";
              }
              if (id(power_state_sensor1).state != new_power_state) {
                id(power_state_sensor1).publish_state(new_power_state);
              }

      # Dati caratteristici dell'alimentatore (registro 0x001): corrente nominale.
      # Accetta sia 0x1081507F sia 0x1081507E (ultimo messaggio della risposta).
      - can_id: 0x1081507E
        can_id_mask: 0x1FFFFFFE
        use_extended_id: true
        then:
          - lambda: |-
              if (id(max_current_found_board_1)) {
                return; // già trovata
              }
              if (x.size() < 8) {
                return; // messaggio troppo corto
              }
              if (x[0] != 0x00 || x[1] != 0x01) {
                return; // non è il registro 0x001
              }
              // 10 bit utili, valore = corrente nominale x 2
              const uint16_t raw = (((uint16_t) x[4] << 8) | x[5]) & 0x3FF;
              const float max_current = raw / 2.0f;
              ESP_LOGI("canbus", "Corrente nominale dell'alimentatore: %.1f A", max_current);
              id(max_current_sensor).publish_state(max_current);
              id(max_current_found_board_1) = true;

              if (max_current > 0) {
                id(amp_scaling_factor) = 1024.0f / max_current;
                ESP_LOGI("canbus", "Nuovo fattore di scala corrente: %.5f", id(amp_scaling_factor));
                id(sf_value).publish_state(id(amp_scaling_factor));
              } else {
                ESP_LOGW("canbus", "Corrente nominale zero: fattore di scala non calcolabile");
              }

      # Stato ventola (registro 0x187): byte 2-3 velocità minima, 4-5
      # velocità richiesta, 6-7 giri. A ventola ferma i giri restano
      # all'ultimo valore, quindi in quel caso si pubblica 0.
      - can_id: 0x1081827E
        use_extended_id: true
        then:
          - lambda: |-
              if (x.size() < 8) return;
              if (x[0] != 0x01 || x[1] != 0x87) return;
              const uint16_t duty_set_raw = ((uint16_t) x[4] << 8) | x[5];
              const uint16_t rpm = ((uint16_t) x[6] << 8) | x[7];
              id(rpm_sensor).publish_state(duty_set_raw > 0 ? rpm : 0);


      # Dati di targa: inizio e corpo del testo
      - can_id: 0x1081D27F
        use_extended_id: true
        then:
          - lambda: |-
              static bool message_started = false;

              if (x.size() == 8) {
                if ((uint8_t)x[0] == 0x00 && (uint8_t)x[1] == 0x01) {
                  id(board_properties) = "";  // nuovo testo: cancella il precedente
                  id(board_properties_complete) = false;
                  message_started = true;
                  id(frame_counter_msg_start1) = 0;
                  ESP_LOGI("dati_targa", "Inizio dei dati di targa");
                }

                if (message_started) {
                  // ogni messaggio porta 6 caratteri a partire da x[2]
                  std::string frame_data((char*)&x[2], 6);
                  id(board_properties) += frame_data;

                  id(frame_counter_msg_start1)++;

                  ESP_LOGD("dati_targa", "Messaggio n. %d: %s", id(frame_counter_msg_start1), frame_data.c_str());
                }
              }

      # Dati di targa: ultimo messaggio, poi lettura dei campi
      - can_id: 0x1081D27E
        use_extended_id: true
        then:
          - lambda: |-
              // eventuali caratteri rimasti nell'ultimo messaggio
              if (x.size() > 2) {
                std::string frame_data((char*)&x[2], x.size() - 2);
                ESP_LOGI("dati_targa", "Ultimo messaggio: %s", frame_data.c_str());

                id(board_properties) += frame_data;
              }
              ESP_LOGI("dati_targa", "Messaggi ricevuti: %d", id(frame_counter_msg_start1));
              ESP_LOGI("dati_targa", "Testo completo: %s", id(board_properties).c_str());

              auto extract_value = [](const std::string &data, const std::string &key) -> std::string {
                size_t start = data.find(key);
                if (start == std::string::npos) return "";
                start += key.size();
                size_t end = data.find_first_of("\r\n", start);
                if (end == std::string::npos) {
                  end = data.size();
                }
                return data.substr(start, end - start);
              };

              struct KeySensorPair {
                const char* key;
                esphome::template_::TemplateTextSensor* sensor;
                bool* flag;
              };

              // le chiavi sono quelle scritte dall'alimentatore (in inglese)
              KeySensorPair mappings[] = {
                {"BoardType=", id(board_type_sensor_1), nullptr},
                {"BarCode=", id(barcode_sensor_1), nullptr},
                {"Item=", id(item_no_sensor_1), nullptr},
                {"Description=", id(description_sensor_1), nullptr},
                {"Manufactured=", id(manufactured_sensor_1), &id(board_properties_complete)}
              };

              bool all_keys_found = true;

              for (const auto& mapping : mappings) {
                std::string value = extract_value(id(board_properties), mapping.key);
                if (!value.empty()) {
                  ESP_LOGI("dati_targa", "Trovato %s %s", mapping.key, value.c_str());
                  mapping.sensor->publish_state(value.c_str());
                  if (mapping.flag) {
                    *(mapping.flag) = true;
                  }
                } else {
                  ESP_LOGW("dati_targa", "Campo %s mancante o vuoto", mapping.key);
                  all_keys_found = false;
                  if (mapping.flag) {
                    *(mapping.flag) = false;
                  }
                }
              }

              if (all_keys_found) {
                id(board_properties_complete) = true;
                ESP_LOGI("dati_targa", "Tutti i campi trovati");
              } else {
                id(board_properties_complete) = false;
                ESP_LOGI("dati_targa", "Mancano alcuni campi");
              }

