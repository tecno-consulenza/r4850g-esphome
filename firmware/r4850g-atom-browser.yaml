    mode: BOX
    restore_value: true
    icon: "mdi:timer-play"
    initial_value: 60
    optimistic: true

# ----------------------------------------------------------
#                       PULSANTI
# ----------------------------------------------------------
button:

  # Statistiche anonime: risposta "No, grazie" alla domanda della pagina
  - platform: template
    name: "Statistiche rifiutate"
    internal: true
    on_press:
      - lambda: |-
          id(stat_scelta) = 2;
          global_preferences->sync();
          id(stat_scelta_text).publish_state("fatta");
          if (id(stat_attive).state) id(stat_attive).turn_off();
          else id(stat_esito_text).publish_state("Disattivate: la scheda non invia nulla");

  # Statistiche anonime: invio immediato dalla pagina (al massimo una volta al minuto)
  - platform: template
    name: "Invia ora le statistiche"
    internal: true
    on_press:
      - lambda: |-
          const int64_t ora = esp_timer_get_time() / 1000000;
          if (!id(stat_attive).state) {
            id(stat_esito_text).publish_state("Disattivate: accendi l'interruttore per inviare");
          } else if (ora - id(stat_manuale) < 60) {
            id(stat_esito_text).publish_state("Aspetta un minuto tra un invio e l'altro");
          } else {
            id(stat_manuale) = ora;
            id(statistiche_invia).execute();
          }

  # pulsante di riavvio (in Home Assistant non compare; nella pagina sì)
  - platform: restart
    id: sys_restart
    name: "Riavvia scheda"
    internal: true

  - platform: template
    name: "Collegati alla rete WiFi"
    internal: true
    on_press:
      - script.execute: applica_wifi

  - platform: template
    name: "Applica impostazioni IP"
    internal: true
    on_press:
      - script.execute: applica_ip

  - platform: template
    name: "Accendi"
    web_server:
      sorting_group_id: grp_comandi
      sorting_weight: 10
    icon: "mdi:power"
    id: can_on_button
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("comandi", "Pulsante Accendi: invio il comando di accensione");
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: [0x01, 0x32, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  - platform: template
    name: "Spegni"
    web_server:
      sorting_group_id: grp_comandi
      sorting_weight: 20
    icon: "mdi:power"
    id: can_off_button
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("comandi", "Pulsante Spegni: invio il comando di spegnimento");
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: [0x01, 0x32, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

  - platform: template
    name: "Rileva alimentatore"
    web_server:
      sorting_group_id: grp_info
      sorting_weight: 110
    icon: "mdi:magnify-scan"
    on_press:
      then:
        - script.execute: setup_sequence

  # Azzera il contatore dell'energia
  - platform: template
    name: "Azzera energia"
    web_server:
      sorting_group_id: grp_comandi
      sorting_weight: 60
    icon: "mdi:restart"
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("energia", "Contatori energia azzerati");
            id(consumed_wh) = 0.0;
            id(consumed_ac_wh) = 0.0;
            id(consumed_wh_sensor).publish_state(0);
            id(consumed_ac_wh_sensor).publish_state(0);
            id(rendimento_medio_sensor).publish_state(NAN);

  # Ventola sempre al massimo
  - platform: template
    name: "Ventola al massimo"
    web_server:
      sorting_group_id: grp_riserva
      sorting_weight: 40
    icon: "mdi:fan"
    on_press:
      then:
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: [0x01, 0x34, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

  # Ventola gestita dall'alimentatore
  - platform: template
    name: "Ventola automatica"
    web_server:
      sorting_group_id: grp_riserva
      sorting_weight: 50
    icon: "mdi:fan-auto"
    on_press:
      then:
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: [0x01, 0x34, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  - platform: template
    name: "Valori 16 celle"
    web_server:
      sorting_group_id: grp_soft
      sorting_weight: 120
    id: restart_staged_charge_button
    icon: "mdi:upload"
    on_press:
      then:
        - lambda: |-
            // === valori per 16 celle LiFePO4 ===
            // make_call().perform() salva i valori anche dopo un riavvio
            id(stage1_threshold).make_call().set_value(55.2f).perform();
            id(stage1_current).make_call().set_value(30.0f).perform();
            id(stage2_threshold).make_call().set_value(55.3f).perform();
            id(stage2_current).make_call().set_value(10.0f).perform();
            id(stage3_threshold).make_call().set_value(55.4f).perform();
            id(stage3_current).make_call().set_value(6.0f).perform();
            id(stage4_threshold).make_call().set_value(55.5f).perform();
            id(stage4_current).make_call().set_value(2.5f).perform();
            id(stage_reset_voltage).make_call().set_value(53.5f).perform();

            // === fasi azzerate: vengono rivalutate al prossimo controllo ===
            id(stage1_active) = false;
            id(stage2_active) = false;
            id(stage3_active) = false;
            id(stage4_active) = false;
            id(stage4_forced_off) = false;
            id(stage4_elapsed_s) = 0;

            ESP_LOGI("carica_fasi", "Caricati i valori consigliati per 16 celle LiFePO4");

  - platform: template
    name: "Valori 15 celle"
    web_server:
      sorting_group_id: grp_soft
      sorting_weight: 130
    id: restart_staged_charge_button2
    icon: "mdi:upload"
    on_press:
      then:
        - lambda: |-
            // === valori per 15 celle LiFePO4 ===
            id(stage1_threshold).make_call().set_value(51.75f).perform();
            id(stage1_current).make_call().set_value(30.0f).perform();
            id(stage2_threshold).make_call().set_value(51.85f).perform();
            id(stage2_current).make_call().set_value(20.0f).perform();
            id(stage3_threshold).make_call().set_value(51.94f).perform();
            id(stage3_current).make_call().set_value(12.0f).perform();
            id(stage4_threshold).make_call().set_value(52.03f).perform();
            id(stage4_current).make_call().set_value(5.0f).perform();
            id(stage_reset_voltage).make_call().set_value(50.16f).perform();

            // === fasi azzerate: vengono rivalutate al prossimo controllo ===
            id(stage1_active) = false;
            id(stage2_active) = false;
            id(stage3_active) = false;
            id(stage4_active) = false;
            id(stage4_forced_off) = false;
            id(stage4_elapsed_s) = 0;

            ESP_LOGI("carica_fasi", "Caricati i valori consigliati per 15 celle LiFePO4");

  - platform: template
    name: "Salva valori"
    web_server:
      sorting_group_id: grp_soft
      sorting_weight: 140
    icon: "mdi:content-save-outline"
    on_press:
      then:
        - lambda: |-
            float src_thr[4] = {
              id(stage1_threshold).state,
              id(stage2_threshold).state,
              id(stage3_threshold).state,
              id(stage4_threshold).state };

            float src_cur[4] = {
              id(stage1_current).state,
              id(stage2_current).state,
              id(stage3_current).state,
              id(stage4_current).state };

            for (int i = 0; i < 4; i++) {
              id(custom_stage)[2*i]     = src_thr[i];
              id(custom_stage)[2*i + 1] = src_cur[i];
            }

            // tensione di ripartenza
            id(custom_stage)[8] = id(stage_reset_voltage).state;

            ESP_LOGI("carica_fasi", "Valori delle fasi salvati");

  - platform: template
    name: "Richiama valori"
    web_server:
      sorting_group_id: grp_soft
      sorting_weight: 150
    icon: "mdi:upload"
    on_press:
      then:
        - lambda: |-
            auto &a = id(custom_stage);

            // Se "Salva" non è mai stato premuto i valori sono zero: non
            // vengono caricati (soglie a 0 V attiverebbero subito tutte le fasi)
            bool valid = true;
            for (int i = 0; i < 4; i++) {
              if (std::isnan(a[2*i]) || a[2*i] < 45.0f || a[2*i] > 58.0f) valid = false;
              if (std::isnan(a[2*i + 1]) || a[2*i + 1] < 0.0f || a[2*i + 1] > 75.0f) valid = false;
            }
            if (std::isnan(a[8]) || a[8] < 48.0f || a[8] > 58.0f) valid = false;
            if (!valid) {
              ESP_LOGW("carica_fasi", "Nessun valore salvato valido: premi prima Salva valori");
              return;
            }

            id(stage1_threshold).make_call().set_value(a[0]).perform();
            id(stage1_current).make_call().set_value(a[1]).perform();
            id(stage2_threshold).make_call().set_value(a[2]).perform();
            id(stage2_current).make_call().set_value(a[3]).perform();
            id(stage3_threshold).make_call().set_value(a[4]).perform();
            id(stage3_current).make_call().set_value(a[5]).perform();
            id(stage4_threshold).make_call().set_value(a[6]).perform();
            id(stage4_current).make_call().set_value(a[7]).perform();
            id(stage_reset_voltage).make_call().set_value(a[8]).perform();

            // fasi azzerate: vengono rivalutate al prossimo controllo
            id(stage1_active) = false;
            id(stage2_active) = false;
            id(stage3_active) = false;
            id(stage4_active) = false;
            id(stage4_forced_off) = false;
            id(stage4_elapsed_s) = 0;

            ESP_LOGI("carica_fasi", "Valori delle fasi richiamati");


# ----------------------------------------------------------
#                   CONTROLLI PERIODICI
# ----------------------------------------------------------
interval:
  # ------------- STATISTICHE ANONIME (ogni minuto) -------------
  # Legge l'esito dell'invio appena finito e decide il prossimo: dopo un invio
  # riuscito fra 24 ore, dopo un errore fra un'ora (o più se il server lo chiede).
  - interval: 60s
    then:
      - lambda: |-
          const int64_t ora = esp_timer_get_time() / 1000000;
          if (__atomic_load_n(&id(stat_stato), __ATOMIC_ACQUIRE) == 2) {
            const int e = id(stat_esito);
            __atomic_store_n(&id(stat_stato), 0, __ATOMIC_RELEASE);
            char t[110];
            if (e >= 200 && e < 300) {
              id(stat_prossimo) = ora + 86400 + (esp_random() % 900);
              auto adesso = id(sntp_time).now();
              if (adesso.is_valid()) {
                snprintf(t, sizeof(t), "Ultimo invio riuscito il %02d/%02d alle %02d:%02d",
                         adesso.day_of_month, adesso.month, adesso.hour, adesso.minute);
              } else {
                snprintf(t, sizeof(t), "Ultimo invio riuscito");
              }
              ESP_LOGI("statistiche", "Statistiche inviate");
            } else {
              int ore = 1;
              if (e == 429 || e == 503) ore = 6;                 // server occupato: riprova più tardi
              if (e == 400 || e == 403 || e == 413 || e == 415) ore = 24;  // dati o chiave rifiutati
              id(stat_prossimo) = ora + (int64_t) ore * 3600;
              const char *quando = ore == 1 ? "tra un'ora" : (ore == 6 ? "tra 6 ore" : "domani");
              if (e < 0) snprintf(t, sizeof(t), "Invio non riuscito: server non raggiungibile. Riprovo %s", quando);
              else snprintf(t, sizeof(t), "Invio non riuscito (risposta %d del server). Riprovo %s", e, quando);
              ESP_LOGW("statistiche", "%s", t);
            }
            id(stat_esito_text).publish_state(t);
            return;
          }
          if (!id(stat_attive).state || id(stat_stato) != 0) return;
          if (ora < id(stat_prossimo)) return;
          id(statistiche_invia).execute();

  # ------------- DIAGNOSTICA E RIPRISTINO CAN (ogni 5 s) -------------
  # Legge lo stato del controller CAN dell'ESP32 e lo mostra in
  # "Stato bus CAN". Se il controller è andato in bus-off (troppi errori
  # di trasmissione) avvia il ripristino e poi lo fa ripartire, senza
  # riavviare la scheda. Se dall'alimentatore non arriva nulla per 10 s i
  # valori diventano "sconosciuto" invece di restare fermi all'ultima lettura.
  - interval: 5s
    then:
      - lambda: |-
          static std::string last_state;
          static uint8_t silent_ticks = 0;
          static bool values_cleared = false;
          const uint32_t rx_total = id(can_rx_count);
          const uint32_t rx_new = rx_total - id(can_rx_last);
          id(can_rx_last) = rx_total;
          id(can_frames_rx_sensor).publish_state(rx_total);

          if (rx_new == 0) {
            if (silent_ticks < 255) silent_ticks++;
          } else {
            silent_ticks = 0;
            values_cleared = false;
          }
          if (silent_ticks >= 2 && !values_cleared) {
            ESP_LOGW("diagnostica_can", "Nessun messaggio dall'alimentatore da 10 s: valori impostati a sconosciuto");
            id(ac_power_in_sensor).publish_state(NAN);
            id(grid_frequency_sensor).publish_state(NAN);
            id(input_current_sensor).publish_state(NAN);
            id(dc_power_out_sensor).publish_state(NAN);
            id(output_voltage_sensor).publish_state(NAN);
            id(set_max_output_current_sensor).publish_state(NAN);
            id(input_grid_voltage_sensor).publish_state(NAN);
            id(output_temperature_sensor).publish_state(NAN);
            id(input_temperature_sensor).publish_state(NAN);
            id(output_current_sensor).publish_state(NAN);
            id(alt_amp_sensor).publish_state(NAN);
            id(rpm_sensor).publish_state(NAN);
            id(power_state_sensor1).publish_state("Non risponde");
            values_cleared = true;
          }

          std::string state_txt;
          unsigned tec = 0, rec = 0;
          twai_status_info_t st;
          if (twai_get_status_info(&st) != ESP_OK) {
            state_txt = "Driver CAN non avviato";
          } else {
            tec = (unsigned) st.tx_error_counter;
            rec = (unsigned) st.rx_error_counter;
            if (st.state == TWAI_STATE_BUS_OFF) {
              state_txt = "Bus-off, ripristino in corso";
              ESP_LOGW("diagnostica_can", "Bus-off: avvio il ripristino del controller CAN");
              twai_initiate_recovery();
            } else if (st.state == TWAI_STATE_RECOVERING) {
              state_txt = "Bus-off, ripristino in corso";
            } else if (st.state == TWAI_STATE_STOPPED) {
              state_txt = "CAN fermo, riavvio";
              ESP_LOGW("diagnostica_can", "Controller CAN fermo: lo riavvio");
              twai_start();
            } else if (tec >= 128) {
              state_txt = "Nessuna risposta dall'alimentatore";
            } else if (rec >= 128) {
              state_txt = "Errori in ricezione";
            } else if (rx_new == 0) {
              state_txt = "Nessun dato dall'alimentatore";
            } else {
              state_txt = "OK";
            }
          }

          if (state_txt != last_state) {
            if (state_txt == "OK") {
              ESP_LOGI("diagnostica_can", "CAN: %s (errori TX %u, errori RX %u, messaggi ricevuti %u)",
                       state_txt.c_str(), tec, rec, (unsigned) rx_total);
            } else {
              ESP_LOGW("diagnostica_can", "CAN: %s (errori TX %u, errori RX %u, messaggi ricevuti %u)",
                       state_txt.c_str(), tec, rec, (unsigned) rx_total);
            }
            id(can_bus_state).publish_state(state_txt);
            last_state = state_txt;
          }

  # richiesta dei dati elettrici, circa una volta al secondo
  - interval: 867ms
    then:
      - canbus.send:
          use_extended_id: true
          can_id: 0x108040FE
          data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  # richiesta dello stato della ventola, stesso ritmo ma sfasata di 433 ms
  - interval: 867ms
    startup_delay: 433ms     # ritardo iniziale che crea lo sfasamento
    then:
      - canbus.send:
          use_extended_id: true
          can_id: 0x108182FE
          data: [0x01, 0x87, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  # ------------- RINVIO PERIODICO DELLE IMPOSTAZIONI (ogni 30 s) -------------
  # Se l'alimentatore non riceve tensione e corrente per un po' passa ai
  # valori di riserva: per questo vengono rimandate.
  - interval: 30s
    then:
      - canbus.send:
          use_extended_id: true
          can_id: 0x108180FE
          data: !lambda |-
            std::vector<uint8_t> can_data(8, 0x00);
            can_data[0] = 0x01;
            int scaled_value = (int) lroundf(id(can_voltage_input).state * id(voltage_scaling_factor));
            can_data[6] = (scaled_value >> 8) & 0xFF;
            can_data[7] = scaled_value & 0xFF;
            return can_data;

  - interval: 30s
    then:
      - canbus.send:
          use_extended_id: true
          can_id: 0x108180FE
          data: !lambda |-
            std::vector<uint8_t> can_data(8, 0x00);
            can_data[0] = 0x01;
            can_data[1] = 0x03;
            int scaled_value = (int) lroundf(id(can_amp_input).state * id(amp_scaling_factor));
            can_data[6] = (scaled_value >> 8) & 0xFF;
            can_data[7] = scaled_value & 0xFF;
            return can_data;

  # Limite di corrente dalla rete AC, rimandato anch'esso: dopo un riavvio
  # dell'alimentatore altrimenti non ci sarebbe più
  - interval: 30s
    then:
      - canbus.send:
          use_extended_id: true
          can_id: 0x108180FE
          data: !lambda |-
            std::vector<uint8_t> can_data(8, 0x00);
            const float ac_limit = id(can_current_limit_input).state;
            const bool enabled = !std::isnan(ac_limit) && ac_limit > 0;
            int scaled_value = enabled ? (int) lroundf(ac_limit * id(voltage_scaling_factor)) : 0;
            can_data[0] = 0x01;
            can_data[1] = 0x09;
            can_data[3] = enabled ? 0x01 : 0x00;
            can_data[6] = (scaled_value >> 8) & 0xFF;
            can_data[7] = scaled_value & 0xFF;
            return can_data;

  # ------------- OROLOGIO E PROGRAMMAZIONE GIORNALIERA (ogni 10 s) -------------
  # Ora: da Home Assistant quando disponibile, altrimenti orologio manuale.
  # Gli eventi di accensione e spegnimento vengono cercati in tutti i minuti
  # trascorsi dall'ultimo controllo, così nessun minuto viene saltato.
  # Se l'ora salta di più di 5 minuti (prima sincronizzazione, ora legale)
  # si riparte da lì senza recuperare eventi.
  - interval: 10s
    then:
      - lambda: |-
          static int last_mod = -1;
          static bool last_from_ha = false;

          // 1) ora attuale (minuto del giorno, 0-1439)
          //    from_ha = ora valida da una fonte esterna (NTP o Home Assistant)
          const uint32_t now_ms = millis();
          int now_mod;
          bool from_ha = false;
          auto t = id(sntp_time).now();   // stesso orologio per NTP e Home Assistant
          if (t.is_valid()) {
            now_mod = t.hour * 60 + t.minute;
            from_ha = true;
            // riallinea l'orologio manuale all'ora esterna
            id(clock_base_min) = now_mod;
            id(clock_base_ms) = now_ms - (uint32_t) t.second * 1000u;
          } else {
            const uint32_t elapsed_min = (now_ms - id(clock_base_ms)) / 60000u;
            now_mod = (int) ((id(clock_base_min) + elapsed_min) % 1440u);
            if (elapsed_min >= 1440u) {
              // riallineamento giornaliero: millis() ricomincia da zero dopo 49 giorni
              id(clock_base_min) = now_mod;
              id(clock_base_ms) += elapsed_min * 60000u;
            }
          }
          id(current_hour) = now_mod / 60;
          id(current_minute) = now_mod % 60;

          // 2) programmazione: disattivata se accensione e spegnimento coincidono
          const int on_mod = (int) id(on_hour).state * 60 + (int) id(on_minute).state;
          const int off_mod = (int) id(off_hour).state * 60 + (int) id(off_minute).state;
          const bool disabled = (on_mod == off_mod);
          id(daily_schedule_disabled) = disabled;
          if (disabled != id(g_schedule_disabled_prev)) {
            if (disabled) {
              ESP_LOGI("orologio", "Accensione e spegnimento alla stessa ora: programmazione disattivata");
            } else {
              ESP_LOGI("orologio", "Orari impostati: programmazione attiva");
            }
            id(g_schedule_disabled_prev) = disabled;
          }
          if (disabled) {
            id(on_time_countdown) = 0;
            id(off_time_countdown) = 0;
          } else {
            id(on_time_countdown) = (on_mod - now_mod + 1440) % 1440;
            id(off_time_countdown) = (off_mod - now_mod + 1440) % 1440;
            if (id(g_show_schedule_update_log)) {
              ESP_LOGI("orologio", "Ora %02d:%02d (%s): prossima accensione fra %d min, prossimo spegnimento fra %d min",
                       now_mod / 60, now_mod % 60,
                       from_ha ? (id(fonte_ora) == 1 ? "internet" : "Home Assistant") : "manuale",
                       id(on_time_countdown), id(off_time_countdown));
              id(g_show_schedule_update_log) = false;
            }
          }

          // 3) eventi nei minuti trascorsi dall'ultimo controllo
          if (last_mod < 0 || from_ha != last_from_ha) {
            last_mod = now_mod;
            last_from_ha = from_ha;
            return;
          }
          const int steps = (now_mod - last_mod + 1440) % 1440;
          if (steps == 0) return;
          if (steps > 5) {
            ESP_LOGI("orologio", "Ora spostata di %d minuti: nessun evento recuperato", steps);
            last_mod = now_mod;
            return;
          }
          for (int i = 1; i <= steps; i++) {
            const int m = (last_mod + i) % 1440;
            if (disabled) break;
            if (m == on_mod) {
              ESP_LOGI("orologio", "Programmazione: accendo l'alimentatore");
              id(can_on_button).press();
            }
            if (m == off_mod) {
              ESP_LOGI("orologio", "Programmazione: spengo l'alimentatore");
              id(can_off_button).press();
            }
          }
          last_mod = now_mod;

  # ------------- TESTO "FASE ATTIVA" (ogni 5 s) -------------
  # Legge soltanto lo stato della carica a fasi, non lo modifica
  - interval: 5s
    then:
      - lambda: |-
          char buf[64];
          if (!id(soft_charge_enable).state) {
            snprintf(buf, sizeof(buf), "Carica a fasi spenta");
          } else if (id(stage4_forced_off)) {
            snprintf(buf, sizeof(buf), "Completata: alimentatore spento");
          } else if (id(stage4_active)) {
            snprintf(buf, sizeof(buf), "Fase 4 bilanciamento: %d di %d min",
                     id(stage4_elapsed_s) / 60, (int) id(stage4_duration).state);
          } else if (id(stage3_active)) {
            snprintf(buf, sizeof(buf), "Fase 3");
          } else if (id(stage2_active)) {
            snprintf(buf, sizeof(buf), "Fase 2");
          } else if (id(stage1_active)) {
            snprintf(buf, sizeof(buf), "Fase 1");
          } else {
            snprintf(buf, sizeof(buf), "Corrente piena");
          }
          if (id(fase_attiva_text).state != buf) {
            id(fase_attiva_text).publish_state(buf);
          }

  ########################################################################
  # Carica a fasi: logica principale, ogni 5 secondi
  ########################################################################
  - interval: 5s
    then:
      - if:
          condition:
            lambda: 'return id(soft_charge_enable).state;'
          then:
            ##################################################################
            # 1) Attivazione delle fasi, nuovo ciclo, tempo della fase 4
            ##################################################################
            - lambda: |-
                const float vbat = id(output_voltage_sensor).state;
                if (std::isnan(vbat)) return;   // nessuna misura: non cambia nulla

                // Nuovo ciclo: la batteria è scesa sotto la tensione di ripartenza.
                // Si azzera anche il blocco della fase 4.
                if (vbat < id(stage_reset_voltage).state) {
                  if (id(stage1_active) || id(stage2_active) || id(stage3_active) ||
                      id(stage4_active) || id(stage4_forced_off)) {
                    ESP_LOGI("carica_fasi", "Batteria a %.2f V, sotto la tensione di ripartenza: fasi azzerate", vbat);
                  }
                  id(stage1_active) = false;
                  id(stage2_active) = false;
                  id(stage3_active) = false;
                  id(stage4_active) = false;
                  id(stage4_elapsed_s) = 0;
                  id(stage4_forced_off) = false;
                }

                if (!id(stage1_active) && vbat >= id(stage1_threshold).state)
                  id(stage1_active) = true;
                if (!id(stage2_active) && vbat >= id(stage2_threshold).state)
                  id(stage2_active) = true;
                if (!id(stage3_active) && vbat >= id(stage3_threshold).state)
                  id(stage3_active) = true;
                if (!id(stage4_forced_off) && !id(stage4_active) &&
                    vbat >= id(stage4_threshold).state)
                  id(stage4_active) = true;

                const bool any_stage_active =
                    (id(stage1_active) || id(stage2_active) ||
                     id(stage3_active) || id(stage4_active) || id(stage4_forced_off));
                if (any_stage_active != id(prev_any_stage_active)) {
                  if (any_stage_active) {
                    ESP_LOGI("carica_fasi", "Inizio della carica a fasi (corrente impostata %.1f A)", id(user_amp));
                  } else {
                    ESP_LOGI("carica_fasi", "Fine della carica a fasi: torno a %.1f A", id(user_amp));
                  }
                  id(prev_any_stage_active) = any_stage_active;
                }

                if (id(stage4_active) && !id(stage4_forced_off))
                  id(stage4_elapsed_s) += 5;
                else
                  id(stage4_elapsed_s) = 0;

            ##################################################################
            # 2) Fine del bilanciamento: spegnimento dell'alimentatore
            ##################################################################
            - if:
                condition:
                  lambda: |-
                    const int limit_s = (int) (id(stage4_duration).state * 60);  // minuti -> secondi
                    return (id(stage4_active) && !id(stage4_forced_off) &&
                            (id(stage4_elapsed_s) >= limit_s));
                then:
                  - lambda: |-
                      ESP_LOGI("carica_fasi",
                               "Fase 4 terminata dopo %.0f min: spengo l'alimentatore",
                               id(stage4_duration).state);
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108080FE
                      data: [0x01, 0x32, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]
                  - lambda: |-
                      id(stage4_active)     = false;
                      id(stage4_forced_off) = true;

            ##################################################################
            # 3) Corrente da applicare
            #    - senza fasi attive: quella impostata da te
            #    - con fasi attive: quella della fase più alta, ma mai sopra
            #      quella impostata da te
            #    - dopo lo spegnimento a fine bilanciamento resta la corrente
            #      della fase 4 finché la batteria non scende sotto la
            #      tensione di ripartenza
            ##################################################################
            - lambda: |-
                if (std::isnan(id(user_amp))) {
                  id(user_amp) = id(can_amp_input).state;
                }
                float commanded = id(user_amp);
                if (std::isnan(commanded)) return;

                float stage_amp = NAN;
                if (id(stage1_active)) stage_amp = id(stage1_current).state;
                if (id(stage2_active)) stage_amp = id(stage2_current).state;
                if (id(stage3_active)) stage_amp = id(stage3_current).state;
                if (id(stage4_active) || id(stage4_forced_off)) stage_amp = id(stage4_current).state;
                if (!std::isnan(stage_amp) && stage_amp < commanded) {
                  commanded = stage_amp;
                }

                // stesso limite per modello usato da "Corrente di carica"
                float max_amps = 75.0f;
                const float sf = id(amp_scaling_factor);
                if (sf >= 18 && sf <= 22) {
                  max_amps = 50.0f;
                } else if (sf >= 13 && sf <= 15) {
                  max_amps = 75.0f;
                } else if (sf >= 25 && sf <= 35) {
                  max_amps = 30.0f;
                }
                if (commanded > max_amps) commanded = max_amps;

                id(last_staged_current) = commanded;
                if (std::isnan(id(can_amp_input).state) ||
                    fabsf(commanded - id(can_amp_input).state) >= 0.05f) {
                  ESP_LOGI("carica_fasi", "Batteria a %.2f V: corrente %.1f A",
                           id(output_voltage_sensor).state, commanded);
                  // on_value di "Corrente di carica" manda il comando CAN
                  id(can_amp_input).publish_state(commanded);
                }
