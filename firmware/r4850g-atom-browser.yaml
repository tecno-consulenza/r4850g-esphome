    id: stage2_threshold
    min_value: 45
    max_value: 58
    step: 0.01
    unit_of_measurement: "V"
    mode: BOX
    restore_value: true
    icon: "mdi:numeric-2-circle"
    optimistic: true
    initial_value: 55.3

  - platform: template
    name: "Fase 2 corrente"
    web_server:
      sorting_group_id: grp_soft
      sorting_weight: 50
    id: stage2_current
    min_value: 0
    max_value: 75
    step: 0.1
    unit_of_measurement: "A"
    mode: BOX
    restore_value: true
    icon: "mdi:numeric-2-circle-outline"
    optimistic: true
    initial_value: 10

  # ================= FASE 3
  - platform: template
    name: "Fase 3 tensione"
    web_server:
      sorting_group_id: grp_soft
      sorting_weight: 60
    id: stage3_threshold
    min_value: 45
    max_value: 58
    step: 0.01
    unit_of_measurement: "V"
    mode: BOX
    restore_value: true
    icon: "mdi:numeric-3-circle"
    optimistic: true
    initial_value: 55.4

  - platform: template
    name: "Fase 3 corrente"
    web_server:
      sorting_group_id: grp_soft
      sorting_weight: 70
    id: stage3_current
    min_value: 0
    max_value: 75
    step: 0.1
    unit_of_measurement: "A"
    mode: BOX
    restore_value: true
    icon: "mdi:numeric-3-circle-outline"
    optimistic: true
