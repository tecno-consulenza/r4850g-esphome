# Copia questo file in secrets.yaml (nella stessa cartella dei file yaml)
# e metti i tuoi valori. secrets.yaml non va condiviso né pubblicato.
# Se usi già ESPHome Device Builder, aggiungi queste righe al secrets.yaml
# che hai già.

# rete WiFi usata al primo avvio (poi si può cambiare dalla pagina della scheda)
wifi_ssid: "NomeDellaTuaRete"
wifi_password: "PasswordDellaTuaRete"

# password della rete di emergenza che la scheda crea se non trova il WiFi
# (almeno 8 caratteri)
ap_password: "scegli-una-password"

# chiave di cifratura per Home Assistant: generane una nuova da
# https://esphome.io/components/api.html (riquadro "encryption key")
# oppure lascia che Device Builder la crei quando aggiungi il dispositivo
api_encryption_key: "INCOLLA-QUI-LA-TUA-CHIAVE-BASE64="
